version: "3.9"

networks:
  pdds-network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  chroma_data:
  ollama_data:

services:

  # ── Databases ─────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: pdds-mongodb
    restart: unless-stopped
    networks: [pdds-network]
    environment:
      MONGO_INITDB_ROOT_USERNAME: pdds_user
      MONGO_INITDB_ROOT_PASSWORD: change_me
      MONGO_INITDB_DATABASE: pdds
    volumes:
      - mongo_data:/data/db
      - ./infra/docker/mongo/init.js:/docker-entrypoint-initdb.d/init.js
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD","mongosh","--eval","db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pdds-redis
    restart: unless-stopped
    networks: [pdds-network]
    command: redis-server --requirepass change_me
    volumes: [redis_data:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: pdds-chromadb
    restart: unless-stopped
    networks: [pdds-network]
    volumes: [chroma_data:/chroma/chroma]
    ports: ["8001:8000"]
    environment:
      ANONYMIZED_TELEMETRY: "false"
      ALLOW_RESET: "true"
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: pdds-ollama
    restart: unless-stopped
    networks: [pdds-network]
    volumes: [ollama_data:/root/.ollama]
    ports: ["11434:11434"]

  # ── Services ──────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: infra/docker/gateway/Dockerfile
    container_name: pdds-gateway
    restart: unless-stopped
    networks: [pdds-network]
    env_file: .env
    ports: ["3000:3000"]
    depends_on:
      redis: {condition: service_healthy}

  detection:
    build:
      context: .
      dockerfile: infra/docker/detection/Dockerfile
    container_name: pdds-detection
    restart: unless-stopped
    networks: [pdds-network]
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./ml/models:/app/models:ro"]
    depends_on:
      mongodb: {condition: service_healthy}

  chat:
    build:
      context: .
      dockerfile: infra/docker/chat/Dockerfile
    container_name: pdds-chat
    restart: unless-stopped
    networks: [pdds-network]
    env_file: .env
    ports: ["8002:8002"]
    depends_on:
      chromadb: {condition: service_healthy}

  education:
    build:
      context: .
      dockerfile: infra/docker/education/Dockerfile
    container_name: pdds-education
    restart: unless-stopped
    networks: [pdds-network]
    env_file: .env
    ports: ["3002:3002"]
    depends_on:
      mongodb: {condition: service_healthy}

  history:
    build:
      context: .
      dockerfile: infra/docker/history/Dockerfile
    container_name: pdds-history
    restart: unless-stopped
    networks: [pdds-network]
    env_file: .env
    ports: ["3003:3003"]
    depends_on:
      mongodb: {condition: service_healthy}
