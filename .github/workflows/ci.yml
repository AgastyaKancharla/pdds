name: CI

# Runs the test suite and a production build on every push and pull request,
# so broken code is caught before it can reach `main` (and therefore production).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Type-check and build
        run: npm run build
        env:
          # Placeholder values so the build step can construct a Supabase client.
          # No network call is made to this host during a build.
          VITE_SUPABASE_URL: https://pdds-ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-real-credential
