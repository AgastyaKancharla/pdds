name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` installs exactly the lockfile, so CI cannot pass on a dependency
      # resolution that a contributor's machine would not reproduce.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit and integration tests
        run: npm test

      # The build is a real gate, not a formality: it is what Vercel runs, and it also
      # regenerates the service worker precache that the offline support depends on.
      - name: Production build
        run: npm run build

      # Guards the project's core promise. The catalog must never ship a chemical dose that
      # reads as an instruction without either CIBRC document verification or explicit
      # suppression/reference-point framing. The knowledge tests enforce this per entry; this
      # step makes it a release gate rather than something a reviewer has to remember.
      - name: Evidence-integrity regression tests
        run: npx vitest run src/lib/__tests__/knowledge.test.ts
