name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Gateway (Node.js) ──────────────────────────────────
  test-gateway:
    name: Test API Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/gateway/package.json
      - run: npm ci
      - run: npm test -- --passWithNoTests

  # ─── Detection Service (Python) ─────────────────────────
  test-detection:
    name: Test Detection Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/detection
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v --tb=short || true

  # ─── Chat Service (Python) ──────────────────────────────
  test-chat:
    name: Test Chat Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v --tb=short || true

  # ─── Web Frontend (Next.js) ─────────────────────────────
  test-web:
    name: Build Web Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

  # ─── Docker Build Check ─────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [test-gateway, test-detection, test-chat]
    steps:
      - uses: actions/checkout@v4
      - name: Build all service images
        run: |
          docker compose build --no-cache
        env:
          ANTHROPIC_API_KEY: dummy
          PINECONE_API_KEY: dummy
